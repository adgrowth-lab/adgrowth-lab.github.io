<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" fill="none">
  <!-- Device Outer Background -->
  <rect width="360" height="640" rx="36" fill="#010101"/>

  <!-- Video Ad Creative Simulated Canvas -->
  <rect x="12" y="12" width="336" height="616" rx="28" fill="#161823"/>

  <!-- Dynamic Creative Visual: E-commerce Product Spotlight -->
  <circle cx="180" cy="280" r="130" fill="#222533"/>
  <circle cx="180" cy="280" r="90" fill="#2d3142"/>
  <rect x="110" y="210" width="140" height="150" rx="16" fill="#0f172a"/>

  <!-- Product / Offer graphic -->
  <rect x="125" y="230" width="110" height="70" rx="8" fill="#fe2c55"/>
  <text x="180" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">$6,000</text>
  <text x="180" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#25f4ee" text-anchor="middle">OFFICIAL AD CREDIT</text>
  <text x="180" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">100% Milestone Match</text>

  <!-- Top TikTok Navigation -->
  <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">LIVE</text>
  <text x="145" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">Following</text>
  <text x="215" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">For You</text>
  <rect x="223" y="52" width="20" height="2" rx="1" fill="#ffffff"/>

  <!-- Search Icon -->
  <circle cx="325" cy="40" r="7" stroke="#ffffff" stroke-width="2"/>
  <line x1="330" y1="45" x2="336" y2="51" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Floating Action Sidebar -->
  <!-- Profile Avatar -->
  <circle cx="320" cy="330" r="22" fill="#ffffff"/>
  <circle cx="320" cy="330" r="20" fill="#1e293b"/>
  <text x="320" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#25f4ee" text-anchor="middle">TT</text>
  <circle cx="320" cy="352" r="9" fill="#fe2c55"/>
  <text x="320" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>

  <!-- Heart / Like -->
  <g transform="translate(305, 380)">
    <path d="M15 5 C10 0, 0 3, 3 13 C5 19, 15 25, 15 25 C15 25, 25 19, 27 13 C30 3, 20 0, 15 5 Z" fill="#fe2c55"/>
    <text x="15" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">142.8K</text>
  </g>

  <!-- Comment -->
  <g transform="translate(305, 435)">
    <circle cx="15" cy="12" r="11" fill="#ffffff"/>
    <polygon points="9,20 15,20 11,24" fill="#ffffff"/>
    <text x="15" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2,840</text>
  </g>

  <!-- Bookmark -->
  <g transform="translate(305, 490)">
    <path d="M7 3 H23 V23 L15 17 L7 23 Z" fill="#ffffff"/>
    <text x="15" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">38.2K</text>
  </g>

  <!-- Share -->
  <g transform="translate(305, 545)">
    <path d="M8 12 L18 4 V9 C26 10 28 17 28 22 C26 18 23 16 18 16 V21 Z" fill="#ffffff"/>
    <text x="15" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">12.5K</text>
  </g>

  <!-- Spinning Vinyl Disc -->
  <circle cx="320" cy="600" r="14" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
  <circle cx="320" cy="600" r="5" fill="#fe2c55"/>

  <!-- Bottom Ad Caption & Call-to-Action -->
  <g transform="translate(24, 460)">
    <!-- Sponsored Tag -->
    <rect x="0" y="0" width="76" height="20" rx="4" fill="#000000" fill-opacity="0.6"/>
    <text x="6" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Sponsored</text>
    <circle cx="70" cy="10" r="2" fill="#25f4ee"/>

    <!-- Handle & Headline -->
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">@tiktok_growth_partner</text>
    <text x="0" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Unlock up to $6,000 ad credit match. Direct agency link.</text>
    <text x="0" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#25f4ee">#TikTokAds #ECommerce #ROAS</text>

    <!-- Interactive TikTok Ad Card Banner -->
    <rect x="0" y="96" width="265" height="42" rx="8" fill="#fe2c55"/>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Claim Ad Voucher</text>
    <text x="235" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">→</text>
  </g>
</svg>